# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Hangzhou Binjiang Youhe Software Studio"
  productName: "Uiautodev Desktop"
  productIdentifier: "dev.uiauto.desktop"
  description: "UIAutoDev desktop application"
  copyright: "Copyright (c) 2025-2026 Hangzhou Binjiang Youhe Software Studio. Licensed under the MIT License."
  comments: ""
  version: "1.1.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

# File Associations
fileAssociations:

# Other data
other:
