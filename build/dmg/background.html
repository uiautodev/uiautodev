<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 720px;
        height: 440px;
        overflow: hidden;
        background: #ffffff;
        font-family:
          -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        position: relative;
        background: radial-gradient(
            72% 52% at 50% 0%,
            #edeff8 0%,
            rgba(244, 245, 251, 0) 72%
          ),
          #ffffff;
      }

      .stage {
        position: absolute;
        inset: 0;
      }

      .sticker {
        position: absolute;
        left: 320px;
        top: 210px;
        width: 62px;
        height: 62px;
        padding: 4px;
        border-radius: 17px;
        background: #ffffff;
        box-shadow:
          0 6px 14px rgba(24, 28, 45, 0.16),
          0 1px 3px rgba(24, 28, 45, 0.12);
        transform: rotate(-8deg);
      }

      .sticker img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 34px;
        text-align: center;
      }

      .caption-zh {
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #1d1d1f;
      }

      .caption-en {
        margin-top: 8px;
        font-size: 13px;
        letter-spacing: 0.3px;
        color: #8a8a8e;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg width="720" height="440" viewBox="0 0 720 440" fill="none">
        <g stroke="#222327" stroke-width="5" stroke-linecap="round">
          <path d="M 272 205 Q 362 286 452 208" />
          <path d="M 426 213 L 452 208 L 443 233" stroke-linejoin="round" />
        </g>

        <g stroke="#12b886" stroke-width="5" stroke-linecap="round">
          <path d="M 588 78 L 600 108" />
          <path d="M 616 68 L 625 100" />
          <path d="M 632 114 L 656 108" />
        </g>
      </svg>

      <div class="sticker">
        <img src="../../build/appicon.png" alt="" />
      </div>

      <div class="caption">
        <div class="caption-zh">将「Uiautodev Desktop」拖入「应用程序」文件夹</div>
        <div class="caption-en">
          Drag it into the Applications folder to install
        </div>
      </div>
    </div>
  </body>
</html>
