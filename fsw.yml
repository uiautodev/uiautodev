desc: Auto generated by fswatch [uiautodev]
triggers:
- name: main
  pattens:
  - '**/*.go'
  - '**/*.c'
  - '**/*.py'
  env:
    DEBUG: "1"
  cmd: go run cmd/uiautodev-server/main.go -proxy-log proxy.log -verbose
  shell: true
  delay: 100ms
  stop_timeout: 500ms
  signal: INT
  kill_signal: ""
watch_paths:
- .
watch_depth: 2
